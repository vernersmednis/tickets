# ===========================================
# ENTRY-LEVEL DOCKER COMPOSE FOR LARAVEL
# ===========================================
# This file defines two services:
#   1. app - Your Laravel application
#   2. db  - MySQL database
#
# To start: docker-compose up --build
# To stop:  docker-compose down

services:
  # -----------------------------------------
  # Laravel Application
  # -----------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tickets-app
    ports:
      - "8000:80"  # Access your app at http://localhost:8000
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=tickets
      - DB_USERNAME=tickets_user
      - DB_PASSWORD=secret
    depends_on:
      - db
    volumes:
      # Optional: Mount storage for file uploads persistence
      - ./storage/app:/var/www/html/storage/app

  # -----------------------------------------
  # MySQL Database
  # -----------------------------------------
  db:
    image: mysql:8.0
    container_name: tickets-db
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: tickets
      MYSQL_USER: tickets_user
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"  # Changed to 3307 because 3306 is already in use on your machine
    volumes:
      # Persist database data
      - db_data:/var/lib/mysql

# Named volume for database persistence
volumes:
  db_data:
